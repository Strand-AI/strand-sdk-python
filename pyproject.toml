[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "strand-sdk"
version = "0.1.0"
description = "Official Python client for the Strand Platform API — H&E → multiplex protein inference."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Strand AI", email = "support@strandai.com" },
]
keywords = ["bioinformatics", "spatial-omics", "pathology", "h&e", "imputation", "anndata", "strand"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "httpx-sse>=0.4",
    "typing-extensions>=4.10",
]

[project.optional-dependencies]
anndata = ["anndata>=0.10", "numpy>=1.24"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
    "anndata>=0.10",
    "numpy>=1.24",
]

[project.urls]
Homepage = "https://strandai.com"
Documentation = "https://docs.strandai.com"
Repository = "https://github.com/Strand-AI/strand-official"
Source = "https://github.com/Strand-AI/strand-official"
Issues = "https://github.com/Strand-AI/strand-official/issues"
Changelog = "https://github.com/Strand-AI/strand-official/blob/main/sdks/python/strand-sdk/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/strand"]

[tool.hatch.build.targets.sdist]
include = ["src/strand", "README.md", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/strand"]

[[tool.mypy.overrides]]
module = ["anndata", "httpx_sse"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error"]
