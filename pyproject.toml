[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "strand-sdk"
version = "0.15.0"
description = "Official Python client for the Strand Platform API — H&E → multiplex protein inference."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
    { name = "Strand AI", email = "support@strandai.com" },
]
keywords = ["bioinformatics", "spatial-omics", "pathology", "h&e", "imputation", "anndata", "strand"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "httpx-sse>=0.4",
    "typing-extensions>=4.10",
    "typer>=0.12",
]

[project.scripts]
strand = "strand._cli:main"

[project.optional-dependencies]
anndata = ["anndata>=0.10", "numpy>=1.24", "zstandard>=0.22; python_version < '3.14'"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
    "anndata>=0.10",
    "numpy>=1.24",
    "zstandard>=0.22; python_version < '3.14'",
]

[project.urls]
Homepage = "https://strandai.com"
Documentation = "https://docs.strandai.com"
Repository = "https://github.com/Strand-AI/strand-sdk-python"
Source = "https://github.com/Strand-AI/strand-sdk-python"
Issues = "https://github.com/Strand-AI/strand-sdk-python/issues"
Changelog = "https://github.com/Strand-AI/strand-sdk-python/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/strand"]

[tool.hatch.build.targets.sdist]
include = ["src/strand", "README.md", "LICENSE"]

# Refuse any package version published in the last 7 days. Rolling-window parity
# with the npm `pnpm.minimumReleaseAge=10080` (10080 min = 7 days) defense in
# platform/package.json against fresh-malware drops (e.g. the Shai-Hulud npm
# worm). `P7D` makes uv recompute `now - 7d` on every resolve. This is a library
# (uv.lock is .gitignored, CI runs `uv sync` without --frozen), so the cooldown
# is enforced fresh on every install — genuinely rolling, no bump automation.
# required-version is FAIL-CLOSED: an older uv silently ignores the P7D
# duration (parse-warns, exits 0) and resolves UNCOOLED, so refuse to run on
# uv < 0.12 (the version CI's setup-uv installs). True floor is 0.9.17.
[tool.uv]
required-version = ">=0.12"
exclude-newer = 'P7D'

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# Typer's API relies on function-call defaults (`typer.Option(...)` /
# `typer.Argument(...)`); they're safe as argument defaults.
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/strand"]

[[tool.mypy.overrides]]
module = ["anndata", "httpx_sse"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error"]
